[workspace]
resolver = "3"
members = ["genkey","synchronous_client", "synchronous_server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Small test suite for websockets"

[workspace.dependencies]
tungstenite = { version = "0.28", features = ["rustls", "url"] }
rcgen = { version = "0.14", features = ["aws_lc_rs"] }
rustls = "0.23"
url = "2.5"
