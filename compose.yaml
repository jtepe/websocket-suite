services:
  synchronous_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: ws-synchronous-server:latest
    restart: "no"
    network_mode: host
    environment:
      # Backend server port on the host.
      WS_PORT: ${SERVER_PORT:-3043}
      # Bind to localhost by default so it's only reachable from the host.
      WS_BIND: ${WS_BIND:-127.0.0.1}
      CERT_PATH: /app/cert.pem
      KEY_PATH: /app/key.pem
    volumes:
      - ./cert.pem:/app/cert.pem:ro,Z
      - ./key.pem:/app/key.pem:ro,Z

  synchronous_client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    image: ws-synchronous-client:latest
    restart: "no"
    network_mode: host
    depends_on:
      - synchronous_server
    environment:
      # Where the client connects. By default it connects directly to the server.
      # For proxy testing, point WS_HOST/WS_PORT (or WSS_URL) at your proxy.
      WS_HOST: ${CLIENT_HOST:-localhost}
      WS_PORT: ${CLIENT_PORT:-3043}
      # Optional; if set it overrides WS_HOST/WS_PORT.
      # WSS_URL: wss://localhost:3043
      CERT_PATH: /app/cert.pem
      CONNECT_RETRIES: ${CONNECT_RETRIES:-100}
      CONNECT_DELAY_MS: ${CONNECT_DELAY_MS:-100}
    volumes:
      - ./cert.pem:/app/cert.pem:ro,Z
